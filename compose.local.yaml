name: mymihomo-dev
services:
  mymihomo:
    image: local/dqgod-mymihomo:dev
    container_name: mymihomo-dev
    restart: unless-stopped
    env_file: .env
    environment:
      # Mihomo restricts API-loaded paths to its home or explicit safe paths.
      SAFE_PATHS: /root/conf
      EXTERNAL_BIND: 127.0.0.1
      EXTERNAL_PORT: 19097
      WEB_CONFIG_PORT: 9097
    ports:
      - "127.0.0.1:7897:7897"
      - "${MYMIHOMO_LAN_IP:?Set MYMIHOMO_LAN_IP in .env}:7897:7897"
      - "127.0.0.1:9097:9097"
      - "${MYMIHOMO_LAN_IP:?Set MYMIHOMO_LAN_IP in .env}:9097:9097"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./conf:/root/conf
      - runtime:/root/.config/mihomo
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  runtime:
